openapi: 3.0.3
info:
  title: Wincl Admin Admin Wallet API
  version: '1.0'
  description: Admin Controller
servers:
- url: https://api.wincl.io:443
  description: Inferred Url
tags:
- name: Admin Wallet
  description: Admin Wallet Controller
paths:
  /bapi/v1/wallet/cert:
    get:
      tags:
      - Admin Wallet
      summary: 유저의 Cert List
      operationId: certListUsingGET
      parameters:
      - name: sortType
        in: query
        description: 정렬기준
        required: false
        style: form
        schema:
          type: string
          enum:
          - AMOUNT_ASC
          - AMOUNT_DESC
          - ASC
          - DESC
          - NONE
          - PRICE_ASC
          - PRICE_DESC
          - UNIT_PRICE_ASC
          - UNIT_PRICE_DESC
      - name: pageSize
        in: query
        description: 페이지당 아이템 개수
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: pageNum
        in: query
        description: 페이지 넘버
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: loginId
        in: query
        description: 유저 아이디
        required: false
        style: form
        schema:
          type: string
      - name: projId
        in: query
        description: 프로젝트 아이디
        required: false
        style: form
        schema:
          type: integer
          format: int32
      - name: projName
        in: query
        description: 프로젝트 이름
        required: false
        style: form
        schema:
          type: string
      - name: startDate
        in: query
        description: 시작일
        required: false
        style: form
        schema:
          type: integer
          format: int64
      - name: endDate
        in: query
        description: 종료일
        required: false
        style: form
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WinclResponseDataList«AdminCert»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer 토큰 값:
        - global
  /bapi/v1/wallet/cert/{projId}/{userId}:
    get:
      tags:
      - Admin Wallet
      summary: 유저의 Cert Detail
      operationId: certDetailUsingGET
      parameters:
      - name: userId
        in: path
        description: userId
        required: true
        style: simple
        schema:
          type: string
      - name: projId
        in: path
        description: projId
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WinclResponseData«AdminCertDetail»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer 토큰 값:
        - global
  /bapi/v1/wallet/credit:
    get:
      tags:
      - Admin Wallet
      summary: 유저의 Credit list
      operationId: creditListUsingGET
      parameters:
      - name: sortType
        in: query
        description: 정렬기준
        required: false
        style: form
        schema:
          type: string
          enum:
          - AMOUNT_ASC
          - AMOUNT_DESC
          - ASC
          - DESC
          - NONE
          - PRICE_ASC
          - PRICE_DESC
          - UNIT_PRICE_ASC
          - UNIT_PRICE_DESC
      - name: pageSize
        in: query
        description: 페이지당 아이템 개수
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: pageNum
        in: query
        description: 페이지 넘버
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: loginId
        in: query
        description: 유저 아이디
        required: false
        style: form
        schema:
          type: string
      - name: projId
        in: query
        description: 프로젝트 아이디
        required: false
        style: form
        schema:
          type: integer
          format: int32
      - name: projName
        in: query
        description: 프로젝트 이름
        required: false
        style: form
        schema:
          type: string
      - name: startDate
        in: query
        description: 시작일
        required: false
        style: form
        schema:
          type: integer
          format: int64
      - name: endDate
        in: query
        description: 종료일
        required: false
        style: form
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WinclResponseDataList«AdminCredit»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer 토큰 값:
        - global
  /bapi/v1/wallet/credit/offset:
    post:
      tags:
      - Admin Wallet
      summary: Credit 일괄 상쇄하기
      operationId: offsetCreditUsingPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OffsetableUserProductRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WinclResponseData«List«string»»'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '915':
          description: ITEM_NOT_FOUND
        '927':
          description: AMOUNT_MUST_BE_GRATER_THAN_ZERO
      security:
      - Bearer 토큰 값:
        - global
  /bapi/v1/wallet/credit/{projId}/{userId}:
    get:
      tags:
      - Admin Wallet
      summary: 유저의 Credit Detail
      operationId: creditDetailUsingGET
      parameters:
      - name: userId
        in: path
        description: userId
        required: true
        style: simple
        schema:
          type: string
      - name: projId
        in: path
        description: projId
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WinclResponseData«AdminCreditDetail»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
