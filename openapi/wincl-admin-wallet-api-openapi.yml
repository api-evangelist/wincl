  /bapi/v1/wallet/history/buy/cancel:
    get:
      tags:
      - Admin Wallet
      summary: 유저의 환불 내역
      operationId: cancelHistoryListUsingGET
      parameters:
      - name: pageSize
        in: query
        description: 페이지당 아이템 개수
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: pageNum
        in: query
        description: 페이지 넘버
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: socialEmail
        in: query
        description: 유저 소셜 이메일
        required: false
        style: form
        schema:
          type: string
      responses:
