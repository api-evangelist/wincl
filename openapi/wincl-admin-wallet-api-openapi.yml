      security:
      - Bearer 토큰 값:
        - global
  /bapi/v1/wallet/gift/sent/{id}:
    get:
      tags:
      - Admin Wallet
      summary: 유저의 보낸 선물 Detail
      operationId: sentGiftDetailUsingGET
      parameters:
      - name: id
        in: path
