  /bapi/v1/wallet/history/buy:
    get:
      tags:
      - Admin Wallet
      summary: 유저의 구매내역
      operationId: buyHistoryListUsingGET
      parameters:
      - name: sortType
        in: query
        description: 정렬기준
        required: false
        style: form
        schema:
          type: string
          enum:
          - AMOUNT_ASC
          - AMOUNT_DESC
          - ASC
          - DESC
          - NONE
          - PRICE_ASC
          - PRICE_DESC
          - UNIT_PRICE_ASC
          - UNIT_PRICE_DESC
      - name: pageSize
        in: query
        description: 페이지당 아이템 개수
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: pageNum
        in: query
        description: 페이지 넘버
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: loginId
        in: query
        description: 유저 아이디
        required: false
        style: form
        schema:
          type: string
      - name: projId
        in: query
        description: 프로젝트 아이디
        required: false
        style: form
        schema:
          type: integer
          format: int32
      - name: prodId
        in: query
        description: 프로덕트 아이디
        required: false
        style: form
        schema:
          type: string
      - name: projName
        in: query
        description: 프로젝트 이름
        required: false
        style: form
        schema:
          type: string
      - name: prodName
        in: query
        description: 프로덕트 이름
        required: false
        style: form
        schema:
          type: string
      - name: startDate
        in: query
        description: 시작일
        required: false
