components:
  schemas:
    Credit:
      title: Credit
      type: object
      properties:
        amt_avail:
          type: number
          description: 보유수량
          format: bigdecimal
        blockchainPurchaseStatus:
          type: string
          description: 블록체인에 기록된 구매 상태
        blockchainTransactionHash:
          type: string
          description: 블록체인 트랜잭션 해쉬
        blockchainTransactionType:
          type: string
          description: '블록체인 트랜잭션 종류: [MINT, TRANSFER, OFFSET]'
        can_transfer:
          type: boolean
          description: 선물가능한지
          example: false
        dttm_buy:
          type: integer
          description: 구매 일자
          format: int64
        dttm_expire:
          type: integer
          description: 유효기한
          format: int64
        id_credit:
          type: string
          description: credit id
    WinclResponseDataList«AdminBuyHistory»:
      title: WinclResponseDataList«AdminBuyHistory»
      type: object
      properties:
        code:
          type: string
        currentPageNum:
          type: integer
          description: 현재 페이지 번호
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminBuyHistory'
        message:
          type: string
        pageSize:
          type: integer
          description: 페이지당 아이템 개수
          format: int32
        sortType:
          type: string
          description: 정렬 기준
          enum:
          - AMOUNT_ASC
          - AMOUNT_DESC
          - ASC
          - DESC
          - NONE
          - PRICE_ASC
          - PRICE_DESC
          - UNIT_PRICE_ASC
          - UNIT_PRICE_DESC
        totalCount:
          type: integer
          description: 전체 아이템 개수
          format: int32
        totalPages:
          type: integer
          description: 전체 페이지 수
          format: int32
    AdminCertDetail:
      title: AdminCertDetail
      type: object
      properties:
        amt:
          type: number
          description: 탄소 소멸량
          format: bigdecimal
        cd_nation:
          type: string
          description: 프로젝트 생성국가
        cert_serial:
          type: string
          description: 인증번호
        corrs_adj:
          type: number
          description: 상응조정률
          format: bigdecimal
        id_login:
          type: string
          description: 유저 아이디
        id_proj:
          type: integer
          description: 프로젝트 아이디
          format: int32
        id_usr:
          type: string
          description: 유저 아이디
        img_thumbnail_proj:
          type: string
          description: 프로젝트 이미지
        nickname:
          type: string
          description: 유저 닉네임
        nm_cert_agc:
          type: string
          description: 인증기관 이름
        nm_proj:
          type: string
          description: 프로젝트 이름
        nm_proj_dev:
          type: string
          description: 프로젝트 개발자이름
        project_effect:
          type: array
          description: 프로젝트 이펙트
          items:
            type: string
            enum:
            - AFFORDABLE_AND_CLEAN_ENERGY
            - CLEAN_WATER_AND_SANITATION
            - CLIMATE_ACTION
            - DECENT_WORK_AND_ECONOMIC_GROWTH
            - GENDER_EQUALITY
            - GOOD_HEALTH_AND_WELLBEING
            - INDUSTRY_INNOVATION_AND_INFRASTRUCTURE
            - LIFE_BELLOW_WATER
            - LIFE_ON_LAND
            - NO_POVERTY
            - PARTNERSHIPS_FOR_THE_GOALS
            - PEACE_JUSTICE_AND_STRONG_INSTITUTIONS
            - QUALITY_EDUCATION
            - REDUCED_INEQUALITIES
            - RESPONSIBLE_CONSUMPTION_AND_PRODUCTION
            - SUSTAINABLE_CITIES_AND_COMMUNITIES
            - ZERO_HUNGER
        project_type:
          type: string
          description: 프로젝트 타입
          enum:
          - AFFORESTATION_REFORESTATION_AND_REVEGETATION
          - AGRICULTURAL_LAND_MANAGEMENT
          - AGRICULTURE_FORESTRY_AND_OTHER_LAND_USE
          - AVOIDED_CONVERSION_OF_GRASSLANDS_AND_SHRUBLANDS
          - CHEMICAL_INDUSTRY
          - CLIMATE_CHANGE_ADAPTION
          - CONSTRUCTION
          - ENERGY
          - ENERGY_DEMAND
          - ENERGY_DISTRIBUTION
          - ENERGY_INDUSTRIES
          - FUGITIVE_EMISSIONS_FROM_FUELS__SOLID_OIL_AND_GAS
          - IMPROVED_FOREST_MANAGEMENT
          - LIVELIHOODS
          - LIVESTOCK_ENTERIC_FERMENTATION_AND_MANURE_MANAGEMENT
          - MANUFACTURING_INDUSTRIES
          - METAL_PRODUCTION
          - MINING_MINERAL_ODUCTION
          - PLASTIC_WASTE_COLLECTION
          - PLASTIC_WASTE_RECYCLING
          - REDUCED_EMISSONS_FROM_FORESTATION_AND_DEGRADATION
          - TRANSPORT
          - UNSPECIFIED
          - WASTE_HANDLING_AND_DISPOSAL
          - WATER_ACCESS_AND_SANITATIO
          - WETLAND_REWETTING_AND_CONSVATION
    UserProductCancelHistory:
      title: UserProductCancelHistory
      type: object
      properties:
        adminEmail:
          type: string
          description: 환불 처리자 이메일
        adminName:
          type: string
          description: 환불 처리자
        cancelAmount:
          type: number
          description: 취소한 수량(톤)
          format: bigdecimal
        currency:
          type: string
          description: 결제 통화
          enum:
          - KRW
          - USD
        pgCanceledPrice:
          type: number
          description: PG 결제 취소 금액
          format: bigdecimal
        procTime:
          type: string
          description: 처리 일시
