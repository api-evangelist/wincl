aid: wincl
name: WinCL
description: >-
  WinCL (윈클) is a Korean integrated carbon-management platform that helps enterprises
  calculate greenhouse-gas emissions, produce climate disclosures and reports, and offset
  their footprint end-to-end. It combines WinCL Monitoring (emissions accounting and climate
  disclosure), a WinCL Marketplace for buying globally certified carbon credits (Verra, Gold
  Standard) and I-REC renewable-energy certificates, a WinCL Reward marketing layer, and
  consulting services. The WinCL API (api.wincl.io, 271 operations, Bearer JWT) exposes wallet,
  credit box, certificate box, product, order, Stripe/KCP payment, and Hedera on-chain
  minting/offset operations so customers can embed carbon purchasing and credit retirement
  directly into their own applications.
